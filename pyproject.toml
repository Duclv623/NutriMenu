[project]
name = "datn-nutrition-rag"
version = "0.1.0"
description = "Source-grounded Vietnamese nutrition education chatbot"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls a real provider API, opt-in only"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
